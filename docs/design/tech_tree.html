<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calima: Flames of the Atlantic — Tech Tree · Árbol de Tecnologías</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1a1108;
    --card-bg:     #2a1f0e;
    --card-border: #3d2e18;
    --gold:        #c8a84b;
    --gold-dim:    #8c7232;
    --gold-bright: #f0cc6a;
    --text:        #d4c49a;
    --text-dim:    #7a6a4a;
    --shadow:      rgba(0,0,0,0.6);
    --glow:        rgba(200,168,75,0.3);
  }

  body {
    background: radial-gradient(ellipse at 50% -20%, #2a1c0c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel { text-align: center; max-width: 560px; }

  h1 {
    color: var(--gold);
    font-size: 1.7rem;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    text-shadow: 0 0 20px rgba(200,168,75,0.5);
    line-height: 1.35;
  }

  .game {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant: small-caps;
    letter-spacing: 0.14em;
    margin-bottom: 10px;
  }

  .rule {
    border: 0;
    border-top: 1px solid var(--card-border);
    margin: 22px auto;
    width: 240px;
  }

  .langs { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

  .langs a {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    color: var(--gold-bright);
    display: block;
    font-size: 1rem;
    letter-spacing: 0.05em;
    min-width: 220px;
    padding: 14px 26px;
    text-decoration: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px var(--shadow);
  }
  .langs a:hover { border-color: var(--gold-dim); box-shadow: 0 0 14px var(--glow); }
  .langs a small { color: var(--text-dim); display: block; font-size: 0.72rem; margin-top: 3px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="game">Calima: Flames of the Atlantic</div>
    <h1>Tech Tree · Árbol de Tecnologías</h1>
    <hr class="rule">
    <div class="langs">
      <a href="tech_tree_es.html" lang="es">Versión en español <small>32 tecnologías · 8 edificios</small></a>
      <a href="tech_tree_en.html">English version <small>32 technologies · 8 buildings</small></a>
    </div>
  </div>
</body>
</html>

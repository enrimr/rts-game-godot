<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calima: Flames of the Atlantic — Tech Tree Reference</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1a1108;
    --card-bg:     #2a1f0e;
    --card-border: #3d2e18;
    --gold:        #c8a84b;
    --gold-dim:    #8c7232;
    --gold-bright: #f0cc6a;
    --text:        #d4c49a;
    --text-dim:    #7a6a4a;
    --age-dark:    #4a3520;
    --age-feudal:  #4a4020;
    --age-castle:  #3a3a50;
    --age-imperial:#4a2020;
    --food:        #e86c2a;
    --wood:        #6aaa3a;
    --gold-res:    #e8c830;
    --stone:       #aaaaaa;
    --shadow:      rgba(0,0,0,0.6);
    --glow:        rgba(200,168,75,0.3);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(180deg, #0d0904 0%, #1a1108 100%);
    border-bottom: 2px solid var(--gold-dim);
    padding: 18px 24px 0;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px var(--shadow);
  }

  header h1 {
    color: var(--gold);
    font-size: 1.6rem;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    text-shadow: 0 0 20px rgba(200,168,75,0.5);
    margin-bottom: 14px;
  }

  /* ── Tab nav ── */
  nav {
    display: flex;
    justify-content: center;
    gap: 4px;
  }

  nav button {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-variant: small-caps;
    letter-spacing: 0.08em;
    padding: 8px 22px;
    transition: color 0.2s, border-color 0.2s;
  }

  nav button:hover { color: var(--gold); }

  nav button.active {
    color: var(--gold-bright);
    border-bottom-color: var(--gold);
  }

  /* ── Main content ── */
  main {
    padding: 28px 20px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Generic card ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .card:hover {
    border-color: var(--gold-dim);
    box-shadow: 0 0 12px var(--glow);
  }

  .card-title {
    color: var(--gold);
    font-size: 0.95rem;
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  /* ── Age banner ── */
  .age-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 4px;
    margin: 28px 0 14px;
    padding: 8px 16px;
    font-variant: small-caps;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--gold-bright);
    font-weight: 600;
  }

  .age-banner.age-0  { background: var(--age-dark);     border-left: 4px solid #8c6a40; }
  .age-banner.age-1  { background: var(--age-feudal);   border-left: 4px solid #8c8a40; }
  .age-banner.age-2  { background: var(--age-castle);   border-left: 4px solid #6060a0; }
  .age-banner.age-3  { background: var(--age-imperial); border-left: 4px solid #a04040; }

  /* ── Resource cost pills ── */
  .cost {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .cost-item {
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 2px 7px;
  }

  .cost-food   { background: rgba(232,108,42,0.18); color: var(--food);     border: 1px solid rgba(232,108,42,0.35); }
  .cost-wood   { background: rgba(106,170,58,0.18); color: var(--wood);     border: 1px solid rgba(106,170,58,0.35); }
  .cost-gold   { background: rgba(232,200,48,0.18); color: var(--gold-res); border: 1px solid rgba(232,200,48,0.35); }
  .cost-stone  { background: rgba(170,170,170,0.18);color: var(--stone);    border: 1px solid rgba(170,170,170,0.35);}

  /* ── Stat row ── */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .stat { white-space: nowrap; }
  .stat span { color: var(--text); font-weight: 600; }

  /* ── ─────────── TAB 1: Civilizations ─────────── ── */
  .civ-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .civ-card .card-title { font-size: 1.1rem; }

  .civ-desc {
    color: var(--text-dim);
    font-size: 0.82rem;
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .hero-box {
    background: rgba(200,168,75,0.06);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 4px;
    margin-bottom: 10px;
    padding: 8px 10px;
  }

  .hero-name {
    color: var(--gold-bright);
    font-size: 0.88rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .hero-ability-label {
    color: var(--gold-dim);
    font-size: 0.72rem;
    font-variant: small-caps;
    letter-spacing: 0.06em;
  }

  .hero-ability-desc {
    color: var(--text);
    font-size: 0.78rem;
    line-height: 1.45;
    margin-top: 2px;
  }

  .hero-cooldown {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 4px;
  }

  .section-label {
    color: var(--gold-dim);
    font-size: 0.7rem;
    font-variant: small-caps;
    letter-spacing: 0.08em;
    margin: 8px 0 4px;
    text-transform: uppercase;
  }

  .unique-units {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .unique-unit-badge {
    background: rgba(200,168,75,0.12);
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    color: var(--gold);
    font-size: 0.75rem;
    padding: 2px 10px;
  }

  .bonuses-list {
    list-style: none;
    font-size: 0.79rem;
    line-height: 1.7;
  }

  .bonuses-list li::before {
    content: "◆ ";
    color: var(--gold-dim);
    font-size: 0.6rem;
  }

  .restrictions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 4px;
  }

  .restriction-pill {
    background: rgba(120,80,60,0.2);
    border: 1px solid rgba(120,80,60,0.4);
    border-radius: 20px;
    color: var(--text-dim);
    font-size: 0.73rem;
    padding: 2px 9px;
    text-decoration: line-through;
    opacity: 0.75;
  }

  .terrain-bonuses {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
    font-size: 0.78rem;
  }

  .terrain-tag {
    background: rgba(40,100,80,0.2);
    border: 1px solid rgba(40,140,100,0.3);
    border-radius: 3px;
    color: #6ecfa0;
    padding: 2px 8px;
  }

  /* ── ─────────── TAB 2: Buildings ─────────── ── */
  .buildings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .building-function {
    background: rgba(200,168,75,0.08);
    border-radius: 3px;
    color: var(--gold-dim);
    font-size: 0.7rem;
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin-top: 6px;
    padding: 2px 7px;
    display: inline-block;
  }

  .footprint-badge {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-top: 6px;
  }

  /* ── ─────────── TAB 3: Units ─────────── ── */
  .units-filter {
    margin-bottom: 20px;
  }

  .units-filter label {
    color: var(--text-dim);
    font-size: 0.82rem;
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin-right: 8px;
  }

  .units-filter select {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 5px 10px;
    cursor: pointer;
  }

  .units-filter select:focus { outline: 1px solid var(--gold-dim); }

  .units-columns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }

  .age-col-header {
    padding: 10px 8px;
    font-variant: small-caps;
    font-size: 0.88rem;
    letter-spacing: 0.08em;
    color: var(--gold-bright);
    border-bottom: 2px solid var(--card-border);
    margin-bottom: 10px;
  }

  .age-col-header.age-0 { background: rgba(74,53,32,0.4); }
  .age-col-header.age-1 { background: rgba(74,64,32,0.4); }
  .age-col-header.age-2 { background: rgba(58,58,80,0.4); }
  .age-col-header.age-3 { background: rgba(74,32,32,0.4); }

  .unit-slot-empty {
    color: var(--text-dim);
    font-size: 1.1rem;
    text-align: center;
    padding: 18px 0;
  }

  .unit-card { margin-bottom: 10px; margin-right: 6px; margin-left: 2px; }

  .unit-card .card-title { font-size: 0.88rem; }

  .special-ability-badge {
    background: rgba(120,60,200,0.15);
    border: 1px solid rgba(160,80,255,0.3);
    border-radius: 3px;
    color: #b080ff;
    font-size: 0.7rem;
    margin-top: 6px;
    padding: 3px 7px;
    line-height: 1.4;
  }

  .unit-notes {
    background: rgba(200,168,75,0.05);
    border-left: 2px solid var(--gold-dim);
    color: var(--text-dim);
    font-size: 0.72rem;
    font-style: italic;
    margin-top: 6px;
    padding: 3px 7px;
  }

  .trained-at {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-bottom: 4px;
    font-variant: small-caps;
    letter-spacing: 0.05em;
  }

  /* ── ─────────── TAB 4: Technologies ─────────── ── */
  .tech-section { margin-bottom: 40px; }

  .tech-section-heading {
    color: var(--gold);
    font-size: 1.1rem;
    font-variant: small-caps;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--card-border);
  }

  .tech-age-col {
    display: grid;
    grid-template-columns: 120px repeat(4, 1fr);
    gap: 0;
    margin-top: 10px;
  }

  .tech-age-label {
    grid-column: 1;
    display: contents;
  }

  .tech-grid-header {
    padding: 8px;
    font-variant: small-caps;
    font-size: 0.8rem;
    color: var(--gold-bright);
    letter-spacing: 0.07em;
    border-bottom: 2px solid var(--card-border);
  }

  .tech-grid-header.age-0 { background: rgba(74,53,32,0.4); }
  .tech-grid-header.age-1 { background: rgba(74,64,32,0.4); }
  .tech-grid-header.age-2 { background: rgba(58,58,80,0.4); }
  .tech-grid-header.age-3 { background: rgba(74,32,32,0.4); }

  .tech-building-label {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 10px 10px 0 0;
    color: var(--text-dim);
    font-size: 0.75rem;
    font-variant: small-caps;
    letter-spacing: 0.05em;
    border-right: 1px solid var(--card-border);
  }

  .tech-cards-column {
    padding: 6px 6px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tech-card { }

  .tech-card .card-title { font-size: 0.85rem; }

  .tech-effect {
    background: rgba(60,100,60,0.15);
    border-left: 2px solid rgba(80,160,80,0.4);
    color: #8ecf8e;
    font-size: 0.73rem;
    margin-top: 6px;
    padding: 3px 7px;
    line-height: 1.4;
  }

  .prereq-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
    align-items: center;
  }

  .prereq-arrow {
    color: var(--text-dim);
    font-size: 0.65rem;
  }

  .prereq-chip {
    background: rgba(200,100,40,0.12);
    border: 1px solid rgba(200,100,40,0.3);
    border-radius: 12px;
    color: #e8a040;
    font-size: 0.68rem;
    padding: 1px 7px;
  }

  .tech-times {
    color: var(--text-dim);
    font-size: 0.73rem;
    margin-top: 4px;
  }

  /* ── Unit Upgrade tech cards ── */
  .tech-card.upgrade-card {
    border-color: rgba(200,168,75,0.5);
  }

  .tech-card.upgrade-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(200,168,75,0.4);
  }

  .upgrade-transform {
    background: rgba(200,168,75,0.08);
    border-left: 2px solid var(--gold-dim);
    color: var(--gold);
    font-size: 0.73rem;
    margin-top: 6px;
    padding: 3px 7px;
    line-height: 1.4;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .units-columns { grid-template-columns: repeat(2, 1fr); }
    .tech-age-col { grid-template-columns: 80px repeat(2, 1fr); }
    header h1 { font-size: 1.1rem; }
    nav button { padding: 7px 12px; font-size: 0.8rem; }
  }

  @media (max-width: 560px) {
    .units-columns { grid-template-columns: 1fr 1fr; }
    .civ-grid { grid-template-columns: 1fr; }
    .buildings-grid { grid-template-columns: 1fr 1fr; }
    .tech-age-col { grid-template-columns: 1fr; }
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; background: #0d0904; }
  ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
</style>
</head>

// ── Helpers ──────────────────────────────────────────────────────────────────

const AGES = DATA.meta.ages;
const AGE_NAMES = [AGES["0"], AGES["1"], AGES["2"], AGES["3"]];

function costHtml(cost) {
  if (!cost) return '';
  const icons = { food: '🍖', wood: '🪵', gold: '💰', stone: '🪨' };
  return '<div class="cost">' +
    Object.entries(cost).map(([res, val]) =>
      `<span class="cost-item cost-${res}">${icons[res] || ''} ${val}</span>`
    ).join('') +
  '</div>';
}

function statRow(stats) {
  if (!stats) return '';
  const parts = [];
  if (stats.hp != null)           parts.push(`<span class="stat">❤️ <span>${stats.hp}</span></span>`);
  if (stats.move_speed != null)   parts.push(`<span class="stat">💨 <span>${stats.move_speed}</span></span>`);
  if (stats.attack != null)       parts.push(`<span class="stat">⚔️ <span>${stats.attack}</span></span>`);
  if (stats.attack_range != null) parts.push(`<span class="stat">📏 <span>${stats.attack_range}</span></span>`);
  if (stats.armor_melee != null)  parts.push(`<span class="stat">🛡️ M<span>${stats.armor_melee}</span></span>`);
  if (stats.armor_pierce != null) parts.push(`<span class="stat">🛡️ P<span>${stats.armor_pierce}</span></span>`);
  return `<div class="stats">${parts.join('')}</div>`;
}

function ageBannerHtml(age) {
  return `<div class="age-banner age-${age}">${AGE_NAMES[age]}</div>`;
}

function formatMultiplier(key, val) {
  const label = key
    .replace(/_/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());

  if (val === 1.0) {
    return `${label}: Enabled`;
  }
  if (val > 1.0) {
    const pct = Math.round((val - 1) * 100);
    return `${label} +${pct}%`;
  }
  if (val === 0.0) {
    return `${label}: Removed`;
  }
  // val < 1.0
  const pct = Math.round((1 - val) * 100);
  return `${label} −${pct}%`;
}

function formatEffects(effects) {
  return Object.entries(effects).map(([key, val]) => {
    const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    if (typeof val === 'number' && val > 1) {
      return `${label} +${Math.round((val-1)*100)}%`;
    }
    if (typeof val === 'number' && val < 1 && val > 0) {
      return `${label} −${Math.round((1-val)*100)}%`;
    }
    if (typeof val === 'number' && Number.isInteger(val) && val <= 5) {
      return `${label} +${val}`;
    }
    return `${label}: ${val}`;
  }).join(' · ');
}

// ── Tab 1: Civilizations ──────────────────────────────────────────────────────

function renderCivs() {
  const heroMap = {};
  DATA.heroes.forEach(h => { heroMap[h.id] = h; });

  const html = '<div class="civ-grid">' +
    DATA.civilizations.map(civ => {
      const hero = heroMap[civ.hero_id];

      const heroHtml = hero ? `
        <div class="hero-box">
          <div class="hero-name">Hero: ${hero.display_name}</div>
          <div class="hero-ability-label">Ability — ${hero.ability.id.replace(/_/g,' ')}</div>
          <div class="hero-ability-desc">${hero.ability.description}</div>
          <div class="hero-cooldown">⏱ Cooldown: ${hero.ability.cooldown} s</div>
        </div>` : '';

      const uniqueUnits = civ.unique_unit_ids.length
        ? `<div class="section-label">Unique Units</div>
           <div class="unique-units">${civ.unique_unit_ids.map(u =>
             `<span class="unique-unit-badge">${u.replace(/_/g,' ')}</span>`).join('')}</div>`
        : '';

      const bonuses = Object.keys(civ.stat_multipliers).length
        ? `<div class="section-label">Bonuses</div>
           <ul class="bonuses-list">${Object.entries(civ.stat_multipliers).map(([k,v]) =>
             `<li>${formatMultiplier(k,v)}</li>`).join('')}</ul>`
        : '';

      const restrictions = civ.missing_units.length
        ? `<div class="section-label">Missing Units</div>
           <div class="restrictions">${civ.missing_units.map(u =>
             `<span class="restriction-pill">${u.replace(/_/g,' ')}</span>`).join('')}</div>`
        : '';

      const terrain = Object.keys(civ.terrain_bonuses).length
        ? `<div class="section-label">Terrain</div>
           <div class="terrain-bonuses">${Object.keys(civ.terrain_bonuses).map(k =>
             `<span class="terrain-tag">${k.replace(/_/g,' ').replace('can traverse ','').replace('can ','')}</span>`).join('')}</div>`
        : '';

      return `<div class="card civ-card">
        <div class="card-title">${civ.display_name}</div>
        <div class="civ-desc">${civ.description}</div>
        ${heroHtml}
        ${uniqueUnits}
        ${bonuses}
        ${restrictions}
        ${terrain}
      </div>`;
    }).join('') +
  '</div>';

  document.getElementById('civs').innerHTML = html;
}

  fish_trap:      'Passive fish income',
  wonder:         'Victory condition building'
};

function renderBuildings() {
  const byAge = {};
  DATA.buildings.forEach(b => {
    const a = b.min_age;
    if (!byAge[a]) byAge[a] = [];
    byAge[a].push(b);
  });

  let html = '';
  for (let age = 0; age <= 3; age++) {
    if (!byAge[age]) continue;
    html += ageBannerHtml(age);
    html += '<div class="buildings-grid">';
    byAge[age].forEach(b => {
      const fn = BUILDING_FUNCTIONS[b.id] || '';
      const hp = b.hp != null ? `<span class="stat">❤️ <span>${b.hp}</span></span>` : '';
      const bt = b.build_time != null ? `<span class="stat">⏱ <span>${b.build_time} s</span></span>` : '';
      const fp = b.footprint ? `<div class="footprint-badge">⬜ ${b.footprint[0]}×${b.footprint[1]} tiles</div>` : '';
      const popBonus = b.pop_bonus ? `<div class="stat">👥 <span>+${b.pop_bonus} pop</span></div>` : '';
      html += `<div class="card">
        <div class="card-title">${b.display_name}</div>
        ${costHtml(b.cost)}
        <div class="stats">${hp}${bt}</div>
        ${fp}
        ${popBonus}
        ${fn ? `<div class="building-function">${fn}</div>` : ''}
      </div>`;
    });
    html += '</div>';
  }

  document.getElementById('buildings').innerHTML = html;
}

// ── Tab 3: Units ──────────────────────────────────────────────────────────────

function renderUnits(filterBuilding) {
  const BUILDING_LABELS = {
    all:           'All',
    town_center:   'Town Center',
    barracks:      'Barracks',
    stable:        'Stable',
    siege_workshop:'Siege Workshop',
    dock:          'Dock'
  };

  // Filter bar
  const filterHtml = `<div class="units-filter">
    <label>Building:</label>
    <select id="unit-building-filter">
      ${Object.entries(BUILDING_LABELS).map(([val, label]) =>
        `<option value="${val}"${val === filterBuilding ? ' selected' : ''}>${label}</option>`
      ).join('')}
    </select>
  </div>`;

  const units = Object.values(DATA.units).filter(u =>
    filterBuilding === 'all' || u.trained_at === filterBuilding
  );

  // Arrange by age column
  const cols = [[], [], [], []];
  units.forEach(u => cols[u.age_required].push(u));

  const headerRow = AGE_NAMES.map((name, i) =>
    `<div class="age-col-header age-${i}">${name}</div>`
  ).join('');

  const maxRows = Math.max(...cols.map(c => c.length));
  let colsHtml = cols.map((col, age) => {
    const cards = col.map(u => {
      const sa = u.special_ability
        ? `<div class="special-ability-badge">⚡ [${u.special_ability.key}] ${u.special_ability.description}</div>`
        : '';
      const notes = u.notes
        ? `<div class="unit-notes">${u.notes}</div>`
        : '';
      return `<div class="card unit-card">
        <div class="trained-at">${u.trained_at.replace(/_/g,' ')}</div>
        <div class="card-title">${u.display_name}</div>
        ${costHtml(u.cost)}
        <div class="stats">
          <span class="stat">❤️ <span>${u.stats.hp}</span></span>
          <span class="stat">💨 <span>${u.stats.move_speed}</span></span>
          <span class="stat">⚔️ <span>${u.stats.attack}</span></span>
          <span class="stat">📏 <span>${u.stats.attack_range}</span></span>
          <span class="stat">🛡️ M<span>${u.stats.armor_melee}</span></span>
          <span class="stat">🛡️ P<span>${u.stats.armor_pierce}</span></span>
          <span class="stat">⏱ <span>${u.train_time} s</span></span>
        </div>
        ${sa}${notes}
      </div>`;
    }).join('');
    return `<div>${cards}${col.length === 0 ? '<div class="unit-slot-empty">—</div>' : ''}</div>`;
  }).join('');

  const html = filterHtml +
    `<div class="units-columns">${headerRow}${colsHtml}</div>`;

  const panel = document.getElementById('units');
  panel.innerHTML = html;

  panel.querySelector('#unit-building-filter').addEventListener('change', function() {
    renderUnits(this.value);
  });
}

// ── Tab 4: Technologies ───────────────────────────────────────────────────────

function renderTechnologies() {
  const sections = [
    { key: 'blacksmith', label: 'Blacksmith' },
    { key: 'university', label: 'University' },
    { key: 'monastery',  label: 'Temple / Monastery' }
  ];

  // Build a map for prereq display names
  const techMap = {};
  DATA.technologies.forEach(t => { techMap[t.id] = t; });

  let html = '';

  sections.forEach(sec => {
    const techs = DATA.technologies.filter(t =>
      t.research_building === sec.key && !t.upgrade_from_unit_id
    );
    if (!techs.length) return;

    const byAge = { 0: [], 1: [], 2: [], 3: [] };
    techs.forEach(t => byAge[t.age_required].push(t));

    const headerRow = `<div style="grid-column:1"></div>` +
      AGE_NAMES.map((name, i) =>
        `<div class="tech-grid-header age-${i}">${name}</div>`
      ).join('');

    const cardsRow = `<div class="tech-building-label">${sec.label}</div>` +
      [0, 1, 2, 3].map(age => {
        const ageTechs = byAge[age];
        if (!ageTechs.length) return `<div class="tech-cards-column"></div>`;
        return `<div class="tech-cards-column">` +
          ageTechs.map(t => {
            const prereqHtml = t.prerequisites.length
              ? `<div class="prereq-chips"><span style="color:var(--text-dim);font-size:0.7rem">Requires:</span>` +
                t.prerequisites.map(pid => {
                  const pt = techMap[pid];
                  return `<span class="prereq-chip">${pt ? pt.display_name : pid}</span>`;
                }).join('<span class="prereq-arrow">→</span>') +
                `</div>`
              : '';

            return `<div class="card tech-card">
              <div class="card-title">${t.display_name}</div>
              ${costHtml(t.cost)}
              <div class="tech-times">⏱ ${t.research_time} s</div>
              ${prereqHtml}
              <div class="tech-effect">${formatEffects(t.effects)}</div>
            </div>`;
          }).join('') +
        `</div>`;
      }).join('');

    html += `<div class="tech-section">
      <div class="tech-section-heading">${sec.label}</div>
      <div class="tech-age-col">${headerRow}${cardsRow}</div>
    </div>`;
  });

  // ── Unit Upgrades section ──
  const upgradeSections = [
    { key: 'barracks', label: 'Barracks' },
    { key: 'stable',   label: 'Stable' }
  ];

  let upgradeInnerHtml = '';
  upgradeSections.forEach(sec => {
    const techs = DATA.technologies.filter(t =>
      t.research_building === sec.key && t.upgrade_from_unit_id
    );
    if (!techs.length) return;

    const byAge = { 0: [], 1: [], 2: [], 3: [] };
    techs.forEach(t => byAge[t.age_required].push(t));

    const headerRow = `<div style="grid-column:1"></div>` +
      AGE_NAMES.map((name, i) =>
        `<div class="tech-grid-header age-${i}">${name}</div>`
      ).join('');

    const cardsRow = `<div class="tech-building-label">${sec.label}</div>` +
      [0, 1, 2, 3].map(age => {
        const ageTechs = byAge[age];
        if (!ageTechs.length) return `<div class="tech-cards-column"></div>`;
        return `<div class="tech-cards-column">` +
          ageTechs.map(t => {
            const prereqHtml = t.prerequisites.length
              ? `<div class="prereq-chips"><span style="color:var(--text-dim);font-size:0.7rem">Requires:</span>` +
                t.prerequisites.map(pid => {
                  const pt = techMap[pid];
                  return `<span class="prereq-chip">${pt ? pt.display_name : pid}</span>`;
                }).join('<span class="prereq-arrow">→</span>') +
                `</div>`
              : '';

            const transformHtml = `<div class="upgrade-transform">▲ ${t.upgrade_from_unit_id.replace(/_/g,' ')} → ${t.upgrade_to_unit_id.replace(/_/g,' ')}</div>`;

            return `<div class="card tech-card upgrade-card">
              <div class="card-title">▲ ${t.display_name}</div>
              ${costHtml(t.cost)}
              <div class="tech-times">⏱ ${t.research_time} s</div>
              ${prereqHtml}
              ${transformHtml}
            </div>`;
          }).join('') +
        `</div>`;
      }).join('');

    upgradeInnerHtml += `<div class="tech-age-col" style="margin-bottom:16px">${headerRow}${cardsRow}</div>`;
  });

  if (upgradeInnerHtml) {
    html += `<div class="tech-section">
      <div class="tech-section-heading">Unit Upgrades</div>
      <p style="color:var(--text-dim);font-size:0.8rem;margin:6px 0 14px">Transforms all existing units of the source type immediately (HP scaled proportionally). The building trains the new type going forward.</p>
      ${upgradeInnerHtml}
    </div>`;
  }

  document.getElementById('technologies').innerHTML = html;
}

// ── Tab switching ─────────────────────────────────────────────────────────────

function activateTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector(`nav button[data-tab="${id}"]`).classList.add('active');
}

document.getElementById('tab-nav').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) activateTab(btn.dataset.tab);
});

// ── Boot ──────────────────────────────────────────────────────────────────────

renderCivs();
renderBuildings();
renderUnits('all');
renderTechnologies();
</script>
</body>
</html>
